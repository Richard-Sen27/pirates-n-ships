plugins {
    // see https://fabricmc.net/develop/ for new versions. The remap variant: Minecraft 1.21.1 is obfuscated. At least
    // 1.17: Loom refuses mods built with a newer Loom minor (GeckoLib 4.9.3 for Fabric: 1.17.21), and 1.17 needs
    // Gradle 9.5 (gradle/wrapper), which runs on the Java 21 toolchain (gradle/gradle-daemon-jvm.properties).
    id 'net.fabricmc.fabric-loom-remap' version '1.17.21' apply false
    // see https://projects.neoforged.net/neoforged/moddevgradle for new versions
    id 'net.neoforged.moddev' version '2.0.140' apply false
}
// Versioning (docs/releasing.md). gradle.properties holds the next planned version as mod_version. Without
// -Pversion=... every build is "<mod_version>-dev", so a local jar never looks like a release; the release workflow
// passes the tag's version (X.Y.Z, X.Y.Z-alpha.N or X.Y.Z-beta.N), which is checked here.
def requestedVersion = providers.gradleProperty('version').orNull
def resolvedVersion
if (requestedVersion == null || requestedVersion.isEmpty() || requestedVersion == 'unspecified') {
    resolvedVersion = "${mod_version}-dev"
} else if (requestedVersion ==~ /\d+\.\d+\.\d+(-(alpha|beta)\.\d+)?/) {
    resolvedVersion = requestedVersion
} else {
    throw new GradleException("-Pversion=${requestedVersion} is not X.Y.Z, X.Y.Z-alpha.N or X.Y.Z-beta.N (docs/releasing.md)")
}
allprojects {
    version = resolvedVersion
}
