plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
            // ./gradlew :neoforge:runData. Providers live in common, output goes to common/src/generated/resources.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
        // ./gradlew :neoforge:runServer: the dedicated server, headless. -Ppirates_n_ships.server.dir=<dir> moves its game
        // directory (default run/, MDG's own); tools/server_smoke.sh (REL3) uses that for a throwaway world.
        server {
            server()
            programArgument '--nogui'
            providers.gradleProperty('pirates_n_ships.server.dir').map { project.file(it) }.orNull?.with { gameDirectory = it }
        }
        // ./gradlew :neoforge:runGameTestServer. Runs every GameTest in the mod namespace and exits
        // with a non-zero code (failing the Gradle task) when a required test fails. Scoped run (GT2):
        // ./gradlew :neoforge:runGameTestServer -Ppirates_n_ships.gametest.only=FooGameTests,BarGameTests forwards the
        // project property as the system property ModGameTests.ONLY_PROPERTY reads; without it nothing is passed and
        // the full suite runs. JAVA_TOOL_OPTIONS="-Dpirates_n_ships.gametest.only=..." keeps working as well.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
            systemProperties.putAll(providers.gradleProperty('pirates_n_ships.gametest.only')
                    .map { ['pirates_n_ships.gametest.only': it] }.orElse([:]))
            // PERF1: -Ppirates_n_ships.perf=true registers the manual performance test (ModGameTests.PERF_PROPERTY),
            // -Ppirates_n_ships.perf.dir=<dir> chooses where its reports go
            systemProperties.putAll(providers.gradleProperty('pirates_n_ships.perf')
                    .map { ['pirates_n_ships.perf': it] }.orElse([:]))
            systemProperties.putAll(providers.gradleProperty('pirates_n_ships.perf.dir')
                    .map { ['pirates_n_ships.perf.dir': it] }.orElse([:]))
            // STR2: -Ppirates_n_ships.layout.dir=<dir> chooses where StructureLayoutGameTests writes its layout dumps
            systemProperties.putAll(providers.gradleProperty('pirates_n_ships.layout.dir')
                    .map { ['pirates_n_ships.layout.dir': it] }.orElse([:]))
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
    // ClientMixinTargetsTest (HV1b) reads the NeoForge-patched Minecraft classes the dev client loads (the
    // neoforge-<version>-minecraft-merged jar) from the JUnit classpath, to check every mixin target without a client.
    addModdingDependenciesTo(sourceSets.test)
}

// Every GameTest run starts from a fresh test world and fresh mod config, as on CI. The world used to outlive runs
// (ships of failed tests stayed in it), and the mod's config files in build/gametest/config/ still do unless deleted
// here: a changed config default never reached the tests on a machine that had run them before (found when a stale
// keel_lateral_drag = 2.0 made the beam-reach test fail only in the orchestrator's checkout).
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        project.delete(project.file('build/gametest/world'))
        project.delete(project.fileTree('build/gametest/config') { include 'pirates_n_ships-*.toml' })
        // No config file watcher in test runs: the run creates the server config fresh, and the watcher reloads it
        // from disk a few seconds later on its own thread, which silently undid every ConfigOverrides value active
        // at that moment (UPK1: walletPaysWhatTheChestCannot paid its crew with provisions back on, morale 36 not 71).
        // FML reads disableConfigWatcher from config/fml.toml.
        def watcher = project.file('build/gametest/config/fml.toml')
        watcher.parentFile.mkdirs()
        String toml = watcher.exists() ? watcher.text : ''
        watcher.text = toml =~ /(?m)^disableConfigWatcher\s*=/
                ? toml.replaceAll(/(?m)^disableConfigWatcher\s*=.*$/, 'disableConfigWatcher = true')
                : 'disableConfigWatcher = true\n' + toml
    }
}

// Mods that only the dev runs load (client, server, GameTest, data). runtimeClasspath is never published, unlike
// runtimeElements, so nothing in localRuntime reaches the POM or mods.toml.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Sable (hard dependency). Its published runtime variant also lists Create, Ponder, Flywheel and
    // Registrate, which Sable only uses for optional compat. We have no Create dependency, so Create and Registrate
    // are excluded. Ponder and Flywheel are our own dependencies since ALM4 (below), so Sable's Flywheel compat is
    // active in every run.
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.simibubi.create'
        exclude group: 'com.tterrag.registrate'
    }
    // Ponder (required, the Almanac's "Show me" scenes) and Flywheel (Ponder's renderer, required on the client).
    // Neither is on Modrinth or CurseForge for 1.21.1, so both ship inside our jar (jar-in-jar, like Create);
    // NeoForge loads the newest copy when another mod bundles them too. Ponder's POM asks for Flywheel 1.0.4; ours
    // (and Sable's runtime POM: Ponder 1.0.82, Flywheel 1.0.6) resolve to the versions in gradle.properties.
    jarJar(implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}"))
    jarJar(implementation("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}"))
    // Player Animation Library (required on the client, docs/animation-libraries.md). The jar already contains
    // PlayerAnimationLibCore and jar-in-jars mochafloats and javassist; its POM still lists Core (and through it newer
    // gson, slf4j, fastutil, netty: PAL issue #163) at runtime. A second copy of Core's packages on the module path
    // would clash with the copy inside the jar, so the separate Core artifact is excluded.
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        exclude group: 'com.zigythebird.playeranim', module: 'PlayerAnimationLibCore'
    }
    // GeckoLib (required on both sides, animated entities). The NeoForge jar contains GeckoLib's common classes and
    // declares no dependencies.
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    // JEI (optional, JEI1). The plugin lives in common (compat/jei); the full JEI jar is only in the dev runs (client,
    // GameTest server, data), never in the POM or a required mods.toml entry. -Ppirates_n_ships.no_jei leaves it out of
    // the runs (checks that the mod loads and plays without JEI).
    compileOnly("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    if (!providers.gradleProperty('pirates_n_ships.no_jei').isPresent()) {
        localRuntime("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    }
    // WorldEdit (dev only, for pasting test ships from art/schematics/). localRuntime puts it on the dev runs'
    // classpath without listing it in the published POM or mods.toml, so players never need it.
    localRuntime("maven.modrinth:worldedit:${worldedit_version}")

    // ClientMixinTargetsTest (HV1b): JUnit, plus ASM's tree API to read the mixin and target classes. Same ASM
    // version as the one Mixin runs on in the dev runs.
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.ow2.asm:asm-tree:9.8'
}

tasks.named('test', Test) {
    useJUnitPlatform()
    testLogging {
        showStandardStreams = true
    }
}

// REL3: what tools/server_smoke.sh --jar needs to run the release jar on a real (production) NeoForge dedicated server,
// in build/server-smoke-kit: mods/ (our jar with its jar-in-jar Ponder and Flywheel, plus the required server-side mods
// as players download them: Sable and GeckoLib; Player Animation Library is client only on NeoForge and deliberately
// absent), installer.jar (the NeoForge server installer), java.txt (the Java 21 toolchain's launcher) and versions.txt.
// The dev run (runServer) cannot stand in for this on NeoForge: its Minecraft jar keeps the client classes loadable.
configurations {
    serverSmokeMods { transitive = false; canBeConsumed = false }
    serverSmokeInstaller { transitive = false; canBeConsumed = false }
}
dependencies {
    serverSmokeMods "dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}"
    serverSmokeMods "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"
    serverSmokeInstaller "net.neoforged:neoforge:${neoforge_version}:installer"
}
def serverSmokeJava = javaToolchains.launcherFor { languageVersion = JavaLanguageVersion.of(java_version) }
tasks.register('serverSmokeKit', Sync) {
    group = 'verification'
    description = 'Collects the release jar, its server-side dependencies and the NeoForge installer for tools/server_smoke.sh --jar'
    def javaPath = serverSmokeJava.map { it.executablePath.asFile.absolutePath }
    def versions = "minecraft=${minecraft_version}\nloader=${neoforge_version}\n"
    inputs.property('java', javaPath)
    from(tasks.named('jar')) { into 'mods' }
    from(configurations.serverSmokeMods) { into 'mods' }
    from(configurations.serverSmokeInstaller) { rename { 'installer.jar' } }
    into layout.buildDirectory.dir('server-smoke-kit')
    doLast {
        new File(destinationDir, 'java.txt').text = javaPath.get() + '\n'
        new File(destinationDir, 'versions.txt').text = versions
    }
}
