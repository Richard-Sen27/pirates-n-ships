modLoader = "javafml" #mandatory
loaderVersion = "${neoforge_loader_version_range}" #mandatory
license = "${license}" # Review your options at https://choosealicense.com/.
#issueTrackerURL="https://change.me.to.your.issue.tracker.example.invalid/" #optional
[[mods]] #mandatory
modId = "${mod_id}" #mandatory
version = "${version}" #mandatory
displayName = "${mod_name}" #mandatory
#updateJSONURL="https://change.me.example.invalid/updates.json" #optional (see https://docs.neoforged.net/docs/misc/updatechecker/)
#displayURL="https://change.me.to.your.mods.homepage.example.invalid/" #optional (displayed in the mod UI)
credits="${credits}" #optional
authors = "${mod_author}" #optional
description = '''${description}''' #mandatory (Supports multiline text)
[[mixins]]
config = "${mod_id}.mixins.json"
[[mixins]]
config = "${mod_id}.neoforge.mixins.json"
[[dependencies.${mod_id}]] #optional
modId = "neoforge" #mandatory
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "[${neoforge_version},)" #mandatory
ordering = "NONE" # The order that this dependency should load in relation to your mod, required to be either 'BEFORE' or 'AFTER' if the dependency is not mandatory
side = "BOTH" # Side this dependency is applied on - 'BOTH', 'CLIENT' or 'SERVER'
[[dependencies.${mod_id}]]
modId = "minecraft"
type="required" #mandatory (Can be one of "required", "optional", "incompatible" or "discouraged")
versionRange = "${minecraft_version_range}"
ordering = "NONE"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "sable"
type="required"
versionRange = "[${sable_version},3.0.0)"
ordering = "AFTER"
side = "BOTH"
# Player Animation Library: melee animations (client only, docs/animation-libraries.md)
[[dependencies.${mod_id}]]
modId = "player_animation_library"
type="required"
versionRange = "${pal_version_range}"
ordering = "NONE"
side = "CLIENT"
# GeckoLib: animated entities (crew, mobs). Required on both sides: the entities implement GeoEntity.
[[dependencies.${mod_id}]]
modId = "geckolib"
type="required"
versionRange = "${geckolib_version_range}"
ordering = "NONE"
side = "BOTH"
# Ponder (the Almanac's "Show me" scenes) and Flywheel (Ponder's renderer, client only), both bundled in our jar
# (jar-in-jar, neoforge/build.gradle); NeoForge picks the newest copy when another mod bundles them too.
[[dependencies.${mod_id}]]
modId = "ponder"
type="required"
versionRange = "[${ponder_version},)"
ordering = "AFTER"
side = "BOTH"
[[dependencies.${mod_id}]]
modId = "flywheel"
type="required"
versionRange = "${flywheel_version_range}"
ordering = "AFTER"
side = "CLIENT"
# JEI (optional, JEI1): our plugin (compat/jei, found by JEI's @JeiPlugin scan) adds info pages, the harbour market,
# shipyard and galley categories. Without JEI nothing of it loads.
[[dependencies.${mod_id}]]
modId = "jei"
type="optional"
versionRange = "${jei_version_range}"
ordering = "NONE"
side = "BOTH"

# Features are specific properties of the game environment, that you may want to declare you require. This example declares
# that your mod requires GL version 3.2 or higher. Other features will be added. They are side aware so declaring this won't
# stop your mod loading on the server for example.
#[features.${mod_id}]
#openGLVersion="[3.2,)"
