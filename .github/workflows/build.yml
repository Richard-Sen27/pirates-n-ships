name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build (includes JUnit tests)
        run: ./gradlew build --console=plain

      - name: GameTests (NeoForge, Sable loaded)
        run: ./gradlew :neoforge:runGameTestServer --console=plain
