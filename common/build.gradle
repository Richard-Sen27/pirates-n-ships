plugins {
    id 'multiloader-common'
    id 'net.neoforged.moddev'
}

neoForge {
    neoFormVersion = neo_form_version
    // Automatically enable AccessTransformers if the file exists
    def at = file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    // Put vanilla Minecraft (and its libraries) on the JUnit classpath, for codec tests etc.
    addModdingDependenciesTo(sourceSets.test)
}

// Datagen output (written by ./gradlew :neoforge:runData). Shipped by every loader module.
sourceSets.main.resources {
    srcDir 'src/generated/resources'
    exclude '.cache/**'
}

dependencies {
    compileOnly group: 'org.spongepowered', name: 'mixin', version: '0.8.5'
    // fabric and neoforge both bundle mixinextras, so it is safe to use it in common
    compileOnly group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'
    annotationProcessor group: 'io.github.llamalad7', name: 'mixinextras-common', version: '0.3.5'

    // Sable (hard dependency). Only the loader-independent API is visible to common.
    compileOnly "dev.ryanhcode.sable:sable-common-${minecraft_version}:${sable_version}"

    // Player Animation Library (melee animations, used only in combat/melee/client/anim/PalMeleeAnimations).
    // PlayerAnimationLibCommon is published remapped to Fabric intermediary names (net.minecraft.class_742 ...), so a
    // Mojang-named common module cannot compile against it. The NeoForge jar contains the same Common + Core classes
    // in Mojang names, and we only reference those (no NeoForge class), so common compiles against it instead.
    // Not transitive: its POM would put Core (already inside the jar) and newer gson/fastutil on our classpath.
    compileOnly("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") { transitive = false }
    // PAL's Molang engine (mochafloats, a Mocha fork): part of PlayerAnimationController's constructor signatures
    compileOnly("com.zigythebird:mochafloats:4.1.0") { transitive = false }

    // GeckoLib (animated entities; imported only in crew/npc/CrewMember, crew/npc/client/, mob/entity/SeafarerMob and
    // mob/client/). Unlike PAL, GeckoLib's
    // published common artifact is in Mojang names (checked with javap), so common compiles against it directly.
    // It declares no dependencies; not transitive anyway, so nothing else reaches our classpath.
    compileOnly("software.bernie.geckolib:geckolib-common-${minecraft_version}:${geckolib_version}") { transitive = false }

    // Unit tests for pure logic and codecs (see docs/design.md §3.3)
    testImplementation platform('org.junit:junit-bom:5.11.3')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    // PalAnimationFilesTest parses our player_animations/*.json with PAL's own loader (loader- and Minecraft-free Core).
    // Not transitive: Minecraft's gson/fastutil/slf4j stay the versions on the test classpath.
    testImplementation("com.zigythebird.playeranim:PlayerAnimationLibCore:${pal_version}") { transitive = false }
    testImplementation("com.zigythebird:mochafloats:4.1.0") { transitive = false }
    testRuntimeOnly("org.javassist:javassist:3.30.2-GA")
    // CrewMemberRigTest parses our geo and animation files with GeckoLib's own Gson adapters and bakes the model.
    testImplementation("software.bernie.geckolib:geckolib-common-${minecraft_version}:${geckolib_version}") { transitive = false }
}

tasks.named('test', Test) {
    useJUnitPlatform()
}

configurations {
    commonJava {
        canBeResolved = false
        canBeConsumed = true
    }
    commonResources {
        canBeResolved = false
        canBeConsumed = true
    }
}

artifacts {
    commonJava sourceSets.main.java.sourceDirectories.singleFile
    // One artifact per resource directory (hand-written + generated), so the loader modules ship both.
    // (A single `sourceDirectories.singleFile` breaks as soon as there is more than one directory.)
    sourceSets.main.resources.srcDirs.each { dir ->
        commonResources dir
    }
}
