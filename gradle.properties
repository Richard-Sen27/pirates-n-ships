# Important Notes:
# Every field you add must be added to the root build.gradle expandProps map.

# Project
# The next planned release, without a suffix. Local builds become <mod_version>-dev; a release build passes the tag's
# version with -Pversion=X.Y.Z[-alpha.N|-beta.N] (root build.gradle, docs/releasing.md).
mod_version=0.1.0
group=com.richardsenger.piratesnships
java_version=21

# Common
minecraft_version=1.21.1
mod_name=Pirates 'n' Ships
mod_author=Richard Senger
mod_id=pirates_n_ships
license=PolyForm-Noncommercial-1.0.0
credits=
description=Sail real block ships that float, flood and sink. Crew them with NPCs, fight the navy and hunt treasure across pirate islands.
minecraft_version_range=[1.21.1, 1.22)
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=1.21.1-20240808.144430
# The version of ParchmentMC that is used, see https://parchmentmc.org/docs/getting-started#choose-a-version for new versions
parchment_minecraft=1.21
parchment_version=2024.11.10

# Fabric (enabled since FAB1, docs/fabric.md). Fabric API and Loader at least what GeckoLib 4.9.3 for Fabric was built
# against (its POM: fabric-api 0.116.12+1.21.1, loader 0.19.3); Sable and Veil ask for less.
fabric_version=0.116.12+1.21.1
fabric_loader_version=0.19.3
# Forge Config API Port (our config on Fabric, the NeoForge config API), the version Sable 2.0.6 for Fabric bundles, see
# https://raw.githubusercontent.com/Fuzss/modresources/main/maven/fuzs/forgeconfigapiport/forgeconfigapiport-fabric/maven-metadata.xml
forgeconfigapiport_version=21.1.3

# NeoForge
neoforge_version=21.1.228
neoforge_loader_version_range=[4,)

# Dependencies
# Sable (hard dependency), see https://maven.ryanhcode.dev/releases/dev/ryanhcode/sable/
sable_version=2.0.6
# Player Animation Library (required on the client), see https://repo.redlance.org/#/public/com/zigythebird/playeranim
pal_version=1.1.6+mc.1.21.1
# Mod version range written into neoforge.mods.toml (PAL's mod version is the Maven version)
pal_version_range=[1.1.6,)
# GeckoLib 4 (required on both sides: animated entities), see
# https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/software/bernie/geckolib/geckolib-neoforge-1.21.1/maven-metadata.xml
geckolib_version=4.9.3
# Mod version range written into neoforge.mods.toml (GeckoLib's mod version is the Maven version)
geckolib_version_range=[4.9.3,)
# Ponder (required, both loaders: the Captain's Almanac's "Show me" scenes, docs/design.md §3.4) and Flywheel (Ponder's
# renderer, required on the client), both from https://maven.createmod.net (sources: github.com/Creators-of-Create/Ponder
# branch mc1.21.1/dev, github.com/Engine-Room/Flywheel branch 1.21.1/dev). Neither is published on Modrinth or
# CurseForge for 1.21.1 (the "ponder" and "flywheel" project pages are Ponder for KubeJS and the legacy Flywheel < 0.6.9),
# so both are bundled as jar-in-jar like Create does (docs/releasing.md). Ponder publishes as
# net.createmod.ponder:ponder-{common,neoforge,fabric}:<version>+mc1.21.1 since 1.0.82 (the old Ponder-NeoForge-1.21.1
# names stop at 1.0.69 and are declared as a capability of the new ones, which Sable's runtime POM already pulls), see
# https://maven.createmod.net/net/createmod/ponder/ponder-neoforge/maven-metadata.xml
# The metadata require at least this version (neoforge.mods.toml [ponder_version,), fabric.mod.json >=ponder_version;
# Ponder's mod version is <version>+mc1.21.1): the API we compile against, and what our jar bundles.
ponder_version=1.0.87
# Flywheel: the newest plain 1.0.x release (1.0.7-48 is a build without a release; Sable 2.0.6 and Create 6.0.10 use
# 1.0.6), see https://maven.createmod.net/dev/engine-room/flywheel/flywheel-neoforge-1.21.1/maven-metadata.xml
flywheel_version=1.0.6
# Mod version range written into neoforge.mods.toml (Ponder's own range for Flywheel). Fabric's metadata names no
# Flywheel: its Fabric jar is client-only, and fabric.mod.json "depends" has no side (Ponder's names none either).
flywheel_version_range=[1.0.0,2.0)
# JEI (optional, both loaders, JEI1: our @JeiPlugin in common's compat/jei), from https://maven.blamejared.com, see
# https://maven.blamejared.com/mezz/jei/jei-1.21.1-neoforge/maven-metadata.xml (19.x = Minecraft 1.21.1). common
# compiles against the common API, the loader modules against their API, and the dev runs load the full jar.
# Modrinth: jei (u6dRKJwZ), CurseForge: 238222 (both optional in the release workflow). One version for both loaders,
# and not the newest (19.57.0.451, 2026-10): every JEI from 19.42 on needs NeoForge 21.1.238 or newer (ours is
# neoforge_version 21.1.228, JEI's commit "Use NeoForge's new TooltipFlag#shouldDisplayAllInformation"), and every
# 19.57 Fabric jar is built with Loom 1.18.2, which our Loom 1.17 refuses to remap. 19.39.0.372 (2026-07-26) is the
# newest that runs on both. Moving neoforge_version to 21.1.238+ would allow the newest JEI on NeoForge.
jei_version=19.39.0.372
# Version ranges written into neoforge.mods.toml and fabric.mod.json ("breaks" below this): the JEI line we compile and
# test against, so an older JEI with a different plugin API is refused with a clear message instead of failing inside
# our plugin. A player's newer JEI is accepted.
jei_version_range=[19.39,)
jei_fabric_version_range=<19.39
# WorldEdit (dev runs only, never a dependency of the mod), the Modrinth version id of 7.3.8 for NeoForge 1.21.1, see
# https://modrinth.com/plugin/worldedit/versions?l=neoforge&g=1.21.1
worldedit_version=WTAFvuRx

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
