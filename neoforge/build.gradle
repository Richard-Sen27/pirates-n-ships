plugins {
    id 'multiloader-loader'
    id 'net.neoforged.moddev'
}

neoForge {
    version = neoforge_version
    // Automatically enable neoforge AccessTransformers if the file exists
    def at = project(':common').file('src/main/resources/META-INF/accesstransformer.cfg')
    if (at.exists()) {
        accessTransformers.from(at.absolutePath)
    }
    parchment {
        minecraftVersion = parchment_minecraft
        mappingsVersion = parchment_version
    }
    runs {
        configureEach {
            systemProperty('neoforge.enabledGameTestNamespaces', mod_id)
            ideName = "NeoForge ${it.name.capitalize()} (${project.path})" // Unify the run config names with fabric
        }
        client {
            client()
        }
        data {
            data()
            // ./gradlew :neoforge:runData. Providers live in common, output goes to common/src/generated/resources.
            programArguments.addAll '--mod', project.mod_id, '--all',
                    '--output', rootProject.file('common/src/generated/resources/').getAbsolutePath(),
                    '--existing', rootProject.file('common/src/main/resources/').getAbsolutePath()
        }
        server {
            server()
        }
        // ./gradlew :neoforge:runGameTestServer. Runs every GameTest in the mod namespace and exits
        // with a non-zero code (failing the Gradle task) when a required test fails.
        gameTestServer {
            type = 'gameTestServer'
            gameDirectory = project.file('build/gametest')
        }
    }
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

// Every GameTest run starts from a fresh test world and fresh mod config, as on CI. The world used to outlive runs
// (ships of failed tests stayed in it), and the mod's config files in build/gametest/config/ still do unless deleted
// here: a changed config default never reached the tests on a machine that had run them before (found when a stale
// keel_lateral_drag = 2.0 made the beam-reach test fail only in the orchestrator's checkout).
tasks.matching { it.name == 'runGameTestServer' }.configureEach {
    doFirst {
        project.delete(project.file('build/gametest/world'))
        project.delete(project.fileTree('build/gametest/config') { include 'pirates_n_ships-*.toml' })
    }
}

// Mods that only the dev runs load (client, server, GameTest, data). runtimeClasspath is never published, unlike
// runtimeElements, so nothing in localRuntime reaches the POM or mods.toml.
configurations {
    localRuntime
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Sable (hard dependency). Its published runtime variant also lists Create, Ponder, Flywheel and
    // Registrate, which Sable only uses for optional compat. We have no Create dependency, so exclude them.
    implementation("dev.ryanhcode.sable:sable-neoforge-${minecraft_version}:${sable_version}") {
        exclude group: 'com.simibubi.create'
        exclude group: 'net.createmod.ponder'
        exclude group: 'dev.engine-room.flywheel'
        exclude group: 'com.tterrag.registrate'
    }
    // Player Animation Library (required on the client, docs/animation-libraries.md). The jar already contains
    // PlayerAnimationLibCore and jar-in-jars mochafloats and javassist; its POM still lists Core (and through it newer
    // gson, slf4j, fastutil, netty: PAL issue #163) at runtime. A second copy of Core's packages on the module path
    // would clash with the copy inside the jar, so the separate Core artifact is excluded.
    implementation("com.zigythebird.playeranim:PlayerAnimationLibNeo:${pal_version}") {
        exclude group: 'com.zigythebird.playeranim', module: 'PlayerAnimationLibCore'
    }
    // GeckoLib (required on both sides, animated entities). The NeoForge jar contains GeckoLib's common classes and
    // declares no dependencies.
    implementation("software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}")
    // GuideME (optional, docs/guide.md as an in-game book, tools/gen_guideme.py). Runtime only: the guide is pure
    // resources (assets/pirates_n_ships/guideme_guides/, guides/), and nothing in our code compiles against GuideME.
    // On the runtime classpath so the dev client, the GameTest server and runData see it. Maven Central, no
    // dependencies in its POM.
    runtimeOnly("org.appliedenergistics:guideme:${guideme_version}")
    // WorldEdit (dev only, for pasting test ships from art/schematics/). localRuntime puts it on the dev runs'
    // classpath without listing it in the published POM or mods.toml, so players never need it.
    localRuntime("maven.modrinth:worldedit:${worldedit_version}")
}
