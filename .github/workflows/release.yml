# Release: build, test and publish the NeoForge and the Fabric jar to Modrinth, CurseForge and GitHub Releases.
# Scheme, secrets and the maintainer's checklist: docs/releasing.md.
#
# - Pushing a tag vX.Y.Z, vX.Y.Z-alpha.N or vX.Y.Z-beta.N publishes that version.
# - "Run workflow" (workflow_dispatch) simulates a tag. With dry_run (the default) it builds, tests, writes the notes
#   and uploads the jars as a workflow artifact, and publishes nothing. Without dry_run the tag must already exist.
#   Its "publish" input picks the loaders to publish (both by default), to retry one loader whose publish failed.
#
# Three jobs (REL6): "build" resolves the version, runs the release-text checks, builds both jars with JUnit and checks
# them, and uploads them with the notes (a few minutes, so a cheap failure no longer waits for the suites); "gametest"
# runs each loader's GameTests and dedicated-server smoke test, NeoForge and Fabric side by side; "publish" uploads the
# build job's jars once both suites passed, and is skipped on a dry run.
name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Tag to release or simulate, e.g. v0.1.0-beta.1'
        required: true
        type: string
      dry_run:
        description: 'Dry run: build, test and upload the jar as an artifact, publish nothing'
        required: false
        type: boolean
        default: true
      publish:
        description: 'Loaders to publish (without dry_run): both, or one of them to retry a failed publish'
        required: false
        type: choice
        options:
          - both
          - neoforge
          - fabric
        default: both

# Read only by default; the publish job alone asks for contents: write (it creates the GitHub release).
permissions:
  contents: read

# One release at a time: a second tag waits until the first one has published.
concurrency:
  group: release
  cancel-in-progress: false

env:
  TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.version }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'true' || 'false' }}
  PUBLISH: ${{ github.event_name == 'workflow_dispatch' && inputs.publish || 'both' }}

jobs:
  # Everything that fails fast: the version, the release texts and notes, the build with JUnit and the two jar checks.
  build:
    name: Build, JUnit and checks
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      channel: ${{ steps.version.outputs.channel }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      ref: ${{ steps.version.outputs.ref }}
      sha: ${{ steps.version.outputs.sha }}
      previous: ${{ steps.version.outputs.previous }}
      neoforge_jar: ${{ steps.jar.outputs.name }}
      fabric_jar: ${{ steps.fabric_jar.outputs.name }}
    steps:
      - name: Check out (full history and tags, for the release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version, channel and previous tag
        id: version
        run: |
          set -euo pipefail
          # Channel rule (docs/releasing.md): -alpha.N -> alpha; -beta.N or any 0.x.y -> beta; otherwise release.
          channel_of() {
            [[ "$1" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(alpha|beta)\.([0-9]+))?$ ]] || return 1
            if [[ "${BASH_REMATCH[5]}" == alpha ]]; then echo alpha
            elif [[ "${BASH_REMATCH[5]}" == beta || "${BASH_REMATCH[1]}" == 0 ]]; then echo beta
            else echo release
            fi
          }
          # Self-check of the rule on fixed input, before it is used.
          [[ "$(channel_of 0.1.0)" == beta && "$(channel_of 0.3.0-beta.1)" == beta \
            && "$(channel_of 0.3.0-alpha.2)" == alpha && "$(channel_of 1.0.0)" == release \
            && "$(channel_of 1.2.0-beta.1)" == beta && "$(channel_of 1.2.0-alpha.1)" == alpha ]] \
            || { echo "::error::channel rule self-check failed"; exit 1; }
          if channel_of 1.0 >/dev/null || channel_of 1.0.0-rc.1 >/dev/null; then
            echo "::error::channel rule accepts a malformed version"; exit 1
          fi

          if [[ "$TAG" != v* ]]; then
            echo "::error::'$TAG' is not a tag of the form vX.Y.Z[-alpha.N|-beta.N]"; exit 1
          fi
          version="${TAG#v}"
          channel="$(channel_of "$version")" \
            || { echo "::error::'$TAG' is not a tag of the form vX.Y.Z[-alpha.N|-beta.N]"; exit 1; }

          if git rev-parse -q --verify "refs/tags/$TAG" >/dev/null; then
            ref="$TAG"
            git checkout -q "refs/tags/$TAG"
          elif [[ "$DRY_RUN" == true ]]; then
            ref=HEAD   # simulated tag: notes and build from the selected branch
          else
            echo "::error::tag $TAG does not exist; push it first (docs/releasing.md)"; exit 1
          fi
          previous="$(git describe --tags --abbrev=0 --match 'v[0-9]*' --exclude "$TAG" "$ref" 2>/dev/null || true)"

          {
            echo "version=$version"
            echo "channel=$channel"
            echo "prerelease=$([[ "$channel" == release ]] && echo false || echo true)"
            echo "ref=$ref"
            echo "sha=$(git rev-parse HEAD)"   # the commit the gametest jobs check out
            echo "previous=$previous"
          } >> "$GITHUB_OUTPUT"
          echo "Version $version ($(git rev-parse --short HEAD)), channel $channel, notes from '${previous:-the first commit}' to $ref, dry run: $DRY_RUN"

      # Before the build: needs only Python and the committed generated lang, fails within seconds.
      - name: Release notes and release-text checks
        env:
          PREVIOUS: ${{ steps.version.outputs.previous }}
          REF: ${{ steps.version.outputs.ref }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          python3 tools/release_notes.py --self-test
          python3 tools/check_release_texts.py
          mkdir -p build/release
          {
            echo "For Minecraft 1.21.1 on **NeoForge** and **Fabric**: download the jar for your loader. Both need Sable,"
            echo "GeckoLib and Player Animation Library; Fabric also needs Fabric API and Forge Config API Port."
            echo
            # REL4: a hand-written docs/release/<version>-notes.md is published below its "PUBLISHED NOTES" marker;
            # the generated list of commits follows it when a previous tag exists.
            notes="docs/release/${VERSION}-notes.md"
            if [[ -f "$notes" ]]; then
              sed -n '/^PUBLISHED NOTES$/,$p' "$notes" | tail -n +2
            fi
            if [[ -n "$PREVIOUS" ]]; then
              echo
              python3 tools/release_notes.py "$PREVIOUS" "$REF"
            fi
          } > build/release/release-notes.md
          cat build/release/release-notes.md >> "$GITHUB_STEP_SUMMARY"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: Build (includes JUnit tests)
        run: ./gradlew build -Pversion=${{ steps.version.outputs.version }} --console=plain

      - name: Check the NeoForge jar
        id: jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(neoforge/build/libs/*-neoforge-*-"$VERSION".jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::expected one release jar for $VERSION in neoforge/build/libs, found: ${jars[*]:-none}"
            ls -l neoforge/build/libs; exit 1
          fi
          jar="${jars[0]}"
          # whitespace-tolerant: the toml is written by Gradle's expand, the spacing is not ours to rely on
          unzip -p "$jar" META-INF/neoforge.mods.toml | grep -E "^[[:space:]]*version[[:space:]]*=[[:space:]]*\"$VERSION\"" \
            || { echo "::error::neoforge.mods.toml in $jar does not carry version $VERSION"; exit 1; }
          cp "$jar" build/release/
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      - name: Check the Fabric jar
        id: fabric_jar
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          jars=(fabric/build/libs/*-fabric-*-"$VERSION".jar)
          if [[ ${#jars[@]} -ne 1 ]]; then
            echo "::error::expected one release jar for $VERSION in fabric/build/libs, found: ${jars[*]:-none}"
            ls -l fabric/build/libs; exit 1
          fi
          jar="${jars[0]}"
          # parse the JSON: Loom writes fabric.mod.json minified, so a grep for '"version": "x"' never matched (v0.1.0)
          unzip -p "$jar" fabric.mod.json | python3 -c 'import json, sys; v = json.load(sys.stdin)["version"]; sys.exit(0 if v == sys.argv[1] else 1)' "$VERSION" \
            || { echo "::error::fabric.mod.json in $jar does not carry version $VERSION"; exit 1; }
          cp "$jar" build/release/
          echo "name=$(basename "$jar")" >> "$GITHUB_OUTPUT"

      # One flat artifact: the two jars and release-notes.md. The publish job uploads exactly these files.
      - name: Upload the jars and notes as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: pirates_n_ships-${{ steps.version.outputs.version }}
          path: |
            build/release/${{ steps.jar.outputs.name }}
            build/release/${{ steps.fabric_jar.outputs.name }}
            build/release/release-notes.md
          if-no-files-found: error

  # The expensive part, one job per loader, both in parallel: GameTests, then the REL3 dedicated-server smoke test on
  # the release jar (built again here from the same commit and version; the published jars are the build job's).
  gametest:
    name: GameTests and server smoke (${{ matrix.loader }})
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        loader: [neoforge, fabric]
        include:
          - loader: neoforge
            gametest: ':neoforge:runGameTestServer'
          - loader: fabric
            gametest: ':fabric:runGameTest'
    steps:
      - name: Check out the release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.build.outputs.sha }}

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle (with cache)
        uses: gradle/actions/setup-gradle@v4

      - name: GameTests (${{ matrix.loader }}, Sable loaded)
        run: ./gradlew ${{ matrix.gametest }} -Pversion=${{ needs.build.outputs.version }} --console=plain

      # REL3: the release jar on a real dedicated server (installed by the loader's own installer), driven through
      # RCON: ship placement and assembly, mobs, waves, ports from generated structures, a convoy, 30 s of ticking, a
      # save and a clean stop. Fails on any exception, missing class, mixin failure or crash (docs/releasing.md,
      # "Dedicated-server smoke test").
      - name: Dedicated-server smoke test (${{ matrix.loader }}, release jar)
        env:
          SMOKE_GRADLE_ARGS: -Pversion=${{ needs.build.outputs.version }}
          SMOKE_OUT: build/server-smoke
        run: tools/server_smoke.sh ${{ matrix.loader }} --jar

      - name: Upload the smoke test logs
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: server-smoke-${{ matrix.loader }}-${{ needs.build.outputs.version }}
          path: build/server-smoke
          if-no-files-found: ignore

  # Only after the build and both loaders' suites passed, and never on a dry run.
  publish:
    name: Publish
    needs: [build, gametest]
    if: ${{ github.event_name == 'push' || !inputs.dry_run }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download the jars and notes
        uses: actions/download-artifact@v4
        with:
          name: pirates_n_ships-${{ needs.build.outputs.version }}
          path: dist

      - name: Check publishing secrets
        id: secrets
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          MODRINTH_ID: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
          CURSEFORGE_ID: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID }}
          NEOFORGE_JAR: dist/${{ needs.build.outputs.neoforge_jar }}
          FABRIC_JAR: dist/${{ needs.build.outputs.fabric_jar }}
        run: |
          missing=()
          for name in MODRINTH_TOKEN MODRINTH_ID CURSEFORGE_TOKEN CURSEFORGE_ID; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if [[ ${#missing[@]} -gt 0 ]]; then
            echo "::error::missing repository secrets/variables: ${missing[*]} (docs/releasing.md)"; exit 1
          fi
          for file in "$NEOFORGE_JAR" "$FABRIC_JAR" dist/release-notes.md; do
            [[ -f "$file" ]] || { echo "::error::$file is not in the downloaded artifact"; ls -l dist; exit 1; }
          done

      # Dependencies use the platforms' project ids, slugs in the comments:
      #   Sable                    modrinth.com/mod/sable                    curseforge.com/minecraft/mc-mods/sable
      #   GeckoLib                 modrinth.com/mod/geckolib                 curseforge.com/minecraft/mc-mods/geckolib
      #   Player Animation Library modrinth.com/mod/player-animation-library curseforge.com/minecraft/mc-mods/player-animation-library
      #   JEI (optional)           modrinth.com/mod/jei                      curseforge.com/minecraft/mc-mods/jei
      # Ponder and Flywheel are required but bundled in our jars (jar-in-jar): neither has a standalone 1.21.1 project
      # (modrinth.com/mod/ponder is Ponder for KubeJS, modrinth.com/mod/flywheel the legacy Flywheel), so they are not
      # listed (docs/releasing.md).
      - name: Publish to Modrinth, CurseForge and GitHub Releases
        if: env.PUBLISH != 'fabric'
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          github-prerelease: ${{ needs.build.outputs.prerelease }}
          files: dist/${{ needs.build.outputs.neoforge_jar }}
          name: Pirates 'n' Ships ${{ needs.build.outputs.version }} for NeoForge 1.21.1
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.channel }}
          changelog-file: dist/release-notes.md
          loaders: neoforge
          game-versions: 1.21.1
          java: 21
          dependencies: |
            sable(required){modrinth:T9PomCSv}{curseforge:1312371}
            geckolib(required){modrinth:8BmcQJ2H}{curseforge:388172}
            player_animation_library(required){modrinth:ha1mEyJS}{curseforge:1283899}
            jei(optional){modrinth:u6dRKJwZ}{curseforge:238222}

      # The Fabric jar: its own Modrinth and CurseForge version (same version number, loader fabric) and a second asset
      # on the GitHub release the NeoForge step created (mc-publish finds the release by its tag and adds the file).
      # It runs even when the NeoForge publish failed (the two are independent; a published NeoForge version is never
      # rolled back), but only after the download and the secrets check passed. A failed loader is retried with Run
      # workflow, dry_run unchecked, publish = that loader (docs/releasing.md).
      # Fabric-only dependencies, slugs in the comments:
      #   Fabric API               modrinth.com/mod/fabric-api               curseforge.com/minecraft/mc-mods/fabric-api
      #   Forge Config API Port    modrinth.com/mod/forge-config-api-port    curseforge.com/minecraft/mc-mods/forge-config-api-port-fabric
      #   JEI (optional)           modrinth.com/mod/jei                      curseforge.com/minecraft/mc-mods/jei
      - name: Publish the Fabric jar to Modrinth, CurseForge and GitHub Releases
        if: ${{ !cancelled() && steps.secrets.outcome == 'success' && env.PUBLISH != 'neoforge' }}
        uses: Kira-NT/mc-publish@v3.3.1
        with:
          modrinth-id: ${{ vars.MODRINTH_ID || secrets.MODRINTH_ID }}
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          curseforge-id: ${{ vars.CURSEFORGE_ID || secrets.CURSEFORGE_ID }}
          curseforge-token: ${{ secrets.CURSEFORGE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ env.TAG }}
          github-prerelease: ${{ needs.build.outputs.prerelease }}
          files: dist/${{ needs.build.outputs.fabric_jar }}
          name: Pirates 'n' Ships ${{ needs.build.outputs.version }} for Fabric 1.21.1
          version: ${{ needs.build.outputs.version }}
          version-type: ${{ needs.build.outputs.channel }}
          changelog-file: dist/release-notes.md
          loaders: fabric
          game-versions: 1.21.1
          java: 21
          dependencies: |
            fabric-api(required){modrinth:P7dR8mSH}{curseforge:306612}
            sable(required){modrinth:T9PomCSv}{curseforge:1312371}
            geckolib(required){modrinth:8BmcQJ2H}{curseforge:388172}
            player_animation_library(required){modrinth:ha1mEyJS}{curseforge:1283899}
            forgeconfigapiport(required){modrinth:ohNO6lps}{curseforge:547434}
            jei(optional){modrinth:u6dRKJwZ}{curseforge:238222}
